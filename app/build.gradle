plugins {
    id 'com.android.application'
}

def tfmReleaseKeystorePath = System.getenv('TFM_RELEASE_KEYSTORE_PATH')
def tfmReleaseSigningEnabled = tfmReleaseKeystorePath != null && !tfmReleaseKeystorePath.trim().isEmpty()

android {
    namespace 'dev.itszain.termuxfilemanager'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.itszain.termuxfilemanager'
        minSdk 23
        targetSdk 32
        versionCode 3
        versionName '0.3.0'
    }

    if (tfmReleaseSigningEnabled) {
        signingConfigs {
            release {
                storeFile file(tfmReleaseKeystorePath)
                storePassword System.getenv('TFM_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('TFM_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('TFM_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (tfmReleaseSigningEnabled) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // targetSdk is intentionally kept at 32 for Termux RUN_COMMAND compatibility.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
