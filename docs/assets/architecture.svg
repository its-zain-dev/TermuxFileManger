<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">TFM Termux architecture diagram</title><desc id="desc">Termux integration from Android UI through review, RUN_COMMAND and results, with file bridge and AI providers.</desc>
<style><![CDATA[
@keyframes drifting{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}}
@keyframes breathe{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-36}}
@keyframes sweep{0%{opacity:0;transform:translateX(-25px)}20%,82%{opacity:1}100%{opacity:0;transform:translateX(24px)}}
@keyframes reveal{0%,13%{opacity:.28}18%,75%{opacity:1}100%{opacity:.28}}
@keyframes trace{0%{stroke-dashoffset:240}100%{stroke-dashoffset:0}}
.drift{animation:drifting 5s ease-in-out infinite;transform-origin:center}
.breathe{animation:breathe 3s ease-in-out infinite}
.moving{stroke-dasharray:9 9;animation:dash 1.7s linear infinite}
.node-a{animation:reveal 9s ease-in-out infinite}
.node-b{animation:reveal 9s ease-in-out 1.5s infinite}
.node-c{animation:reveal 9s ease-in-out 3s infinite}
.node-d{animation:reveal 9s ease-in-out 4.5s infinite}
.node-e{animation:reveal 9s ease-in-out 6s infinite}
@media(prefers-reduced-motion:reduce){.drift,.breathe,.moving,.node-a,.node-b,.node-c,.node-d,.node-e{animation:none}}
]]></style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1527"/><stop offset=".58" stop-color="#101c32"/><stop offset="1" stop-color="#08111e"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#70f2d5"/><stop offset="1" stop-color="#a2a5ff"/></linearGradient>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="21"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".3"/></filter></defs>
<rect width="1200" height="510" rx="28" fill="url(#bg)"/><rect width="1200" height="510" rx="28" fill="url(#grid)"/><text x="55" y="58" fill="#f0f7ff" font-size="29" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="760" >HOW TFM TALKS TO TERMUX</text><text x="55" y="91" fill="#9aafc4" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Reviewed commands cross an Android permission boundary and return visible results.</text><rect x="48" y="161" width="216" height="149" rx="20" fill="#132438" stroke="#66e6d0" stroke-opacity=".30"/><text x="71" y="193" fill="#66e6d0" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="750" >01</text><text x="71" y="232" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="760" >ANDROID APP</text><text x="71" y="262" fill="#9aafc4" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Compose UI</text><text x="71" y="287" fill="#66e6d0" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Files / Editor / Agent</text><rect x="344" y="161" width="216" height="149" rx="20" fill="#132438" stroke="#a3a2ff" stroke-opacity=".30"/><text x="367" y="193" fill="#a3a2ff" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="750" >02</text><text x="367" y="232" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="760" >ACTION REVIEW</text><text x="367" y="262" fill="#9aafc4" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Confirm write or run</text><text x="367" y="287" fill="#a3a2ff" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Safe read-only actions</text><rect x="638" y="161" width="216" height="149" rx="20" fill="#132438" stroke="#66e6d0" stroke-opacity=".30"/><text x="661" y="193" fill="#66e6d0" font-size="16" font-family="Inter, Segoe UI, Arial, 