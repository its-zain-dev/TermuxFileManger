plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.itszain.termuxfilemanager'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.itszain.termuxfilemanager'
        minSdk 23
        targetSdk 32
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
