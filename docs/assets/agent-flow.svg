<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">AI agent workflow</title><desc id="desc">Six-stage animated loop for assistant prompting, planning, tool calls, approval, Termux execution and result handoff.</desc>
<style><![CDATA[
@keyframes drifting{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}}
@keyframes breathe{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-36}}
@keyframes sweep{0%{opacity:0;transform:translateX(-25px)}20%,82%{opacity:1}100%{opacity:0;transform:translateX(24px)}}
@keyframes reveal{0%,13%{opacity:.28}18%,75%{opacity:1}100%{opacity:.28}}
@keyframes trace{0%{stroke-dashoffset:240}100%{stroke-dashoffset:0}}
.drift{animation:drifting 5s ease-in-out infinite;transform-origin:center}
.breathe{animation:breathe 3s ease-in-out infinite}
.moving{stroke-dasharray:9 9;animation:dash 1.7s linear infinite}
.node-a{animation:reveal 9s ease-in-out infinite}
.node-b{animation:reveal 9s ease-in-out 1.5s infinite}
.node-c{animation:reveal 9s ease-in-out 3s infinite}
.node-d{animation:reveal 9s ease-in-out 4.5s infinite}
.node-e{animation:reveal 9s ease-in-out 6s infinite}
@media(prefers-reduced-motion:reduce){.drift,.breathe,.moving,.node-a,.node-b,.node-c,.node-d,.node-e{animation:none}}
]]></style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1527"/><stop offset=".58" stop-color="#101c32"/><stop offset="1" stop-color="#08111e"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#70f2d5"/><stop offset="1" stop-color="#a2a5ff"/></linearGradient>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="21"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".3"/></filter></defs>
<rect width="1200" height="460" rx="28" fill="url(#bg)"/><rect width="1200" height="460" rx="28" fill="url(#grid)"/><text x="52" y="60" fill="#f0f7ff" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="760" >THE AI AGENT EXECUTION LOOP</text><text x="52" y="90" fill="#9aafc4" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Inspect, plan, request tools, review and continue with real command output.</text><g class="node-a"><rect x="35" y="165" width="179" height="150" rx="19" fill="#14243a" stroke="#66e6d0" stroke-opacity=".3"/><circle cx="63" cy="202" r="11" fill="#66e6d0"/><text x="61" y="207" fill="#09111f" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" >1</text><text x="57" y="251" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="780" >PROMPT</text><text x="57" y="280" fill="#9aafc4" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Developer goal</text></g><path d="M214 235 L229 235" stroke="#66e6d0" stroke-width="3" fill="none" class="moving"/><g class="node-b"><rect x="231" y="165" width="179" height="150" rx="19" fill="#14243a" stroke="#a3a2ff" stroke-opacity=".3"/><circle cx="259" cy="202" r="11" fill="#a3a2ff"/><text x="257" y="207" fill="#09111f" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" >2</text><text x="253" y="251" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="780" >MODEL</text><text x="253" y="280" fill="#9aafc4" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Plan next step</text></g><path d="M410 235 L425 235" stroke="#66e6d0" stroke-width="3" fill="none" class="moving"/><g class="node-c"><rect x="427" y="165" width="179" height="150" rx="19" fill="#14243a" stroke="#66e6d0" stroke-opacity=".3"/><circle cx="455" cy="202" r="11" fill="#66e6d0"/><text x="453" y="207" fill="#09111f" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" >3</text><text x="449" y="251" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="780" >TOOL CALL</text><text x="449" y="280" fill="#9aafc4" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Structured request</text></g><path d="M606 235 L621 235" stroke="#66e6d0" stroke-width="3" fill="none" class="moving"/><g class="node-d"><rect x="623" y="165" width="179" height="150" rx="19" fill="#14243a" stroke="#a3a2ff" stroke-opacity=".3"/><circle cx="651" cy="202" r="11" fill="#a3a2ff"/><text x="649" y="207" fill="#09111f" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" >4</text><text x="645" y="251" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="780" >APPROVAL</text><text x="645" y="280" fill="#9aafc4" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Confirm writes</text></g><path d="M802 235 L817 235" stroke="#66e6d0" stroke-width="3" fill="none" class="moving"/><g class="node-e"><rect x="819" y="165" width="179" height="150" rx="19" fill="#14243a" stroke="#66e6d0" stroke-opacity=".3"/><circle cx="847" cy="202" r="11" fill="#66e6d0"/><text x="845" y="207" fill="#09111f" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" >5</text><text x="841" y="251" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="780" >TERMUX</text><text x="841" y="280" fill="#9aafc4" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Execute command</text></g><path d="M998 235 L1013 235" stroke="#66e6d0" stroke-width="3" fill="none" class="moving"/><g class="node-a"><rect x="1015" y="165" width="179" height="150" rx="19" fill="#14243a" stroke="#a3a2ff" stroke-opacity=".3"/><circle cx="1043" cy="202" r="11" fill="#a3a2ff"/><text x="1041" y="207" fill="#09111f" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" >6</text><text x="1037" y="251" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="780" >RESULT</text><text x="1037" y="280" fill="#9aafc4" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Return stdout</text></g><path d="M1095 329 V376 H128 V329" stroke="#66e6d0" opacity=".6" class="moving" stroke-width="3" fill="none"/><text x="607" y="412" fill="#9aafc4" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" text-anchor="middle" >The assistant may continue with tool results; canceled work is not silently replayed.</text></svg>