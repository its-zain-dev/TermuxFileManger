t-weight="750" >FILE BRIDGE</text><text x="69" y="415" fill="#f0f7ff" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="650" >JSON protocol inside Termux</text><text x="69" y="437" fill="#9aafc4" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Read, search and guarded file operations</text><rect x="652" y="356" width="497" height="98" rx="17" fill="#21263e" stroke="#a3a2ff" stroke-opacity=".2"/><text x="675" y="386" fill="#a3a2ff" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="750" >AI PROVIDERS</text><text x="675" y="415" fill="#f0f7ff" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="650" >ChatGPT / Gemini / custom endpoints</text><text x="675" y="437" fill="#9aafc4" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >HTTPS requests originate in the Android app</text><path d="M168 311 L168 352" stroke="#66e6d0" stroke-width="2" fill="none" class="moving"/><text x="600" y="490" fill="#9aafc4" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" text-anchor="middle" >TFM does not bypass Android sandboxing or Termux permissions.</text></svg>