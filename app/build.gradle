plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def tfmReleaseKeystorePath = System.getenv('TFM_RELEASE_KEYSTORE_PATH')
def tfmReleaseSigningEnabled = tfmReleaseKeystorePath != null && !tfmReleaseKeystorePath.trim().isEmpty()

android {
    namespace 'dev.itszain.termuxfilemanager'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.itszain.termuxfilemanager'
        minSdk 23
        targetSdk 32
        versionCode 6
        versionName '0.5.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    if (tfmReleaseSigningEnabled) {
        signingConfigs {
            release {
                storeFile file(tfmReleaseKeystorePath)
                storePassword System.getenv('TFM_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('TFM_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('TFM_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (tfmReleaseSigningEnabled) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // targetSdk is intentionally kept at 32 for Termux RUN_COMMAND compatibility.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
}

ksp { arg('room.schemaLocation', "$projectDir/schemas") }

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
