<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Workspace illustration</title><desc id="desc">Four vector illustrations of features, not real screenshots of the Android application.</desc>
<style><![CDATA[
@keyframes drifting{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}}
@keyframes breathe{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-36}}
@keyframes sweep{0%{opacity:0;transform:translateX(-25px)}20%,82%{opacity:1}100%{opacity:0;transform:translateX(24px)}}
@keyframes reveal{0%,13%{opacity:.28}18%,75%{opacity:1}100%{opacity:.28}}
@keyframes trace{0%{stroke-dashoffset:240}100%{stroke-dashoffset:0}}
.drift{animation:drifting 5s ease-in-out infinite;transform-origin:center}
.breathe{animation:breathe 3s ease-in-out infinite}
.moving{stroke-dasharray:9 9;animation:dash 1.7s linear infinite}
.node-a{animation:reveal 9s ease-in-out infinite}
.node-b{animation:reveal 9s ease-in-out 1.5s infinite}
.node-c{animation:reveal 9s ease-in-out 3s infinite}
.node-d{animation:reveal 9s ease-in-out 4.5s infinite}
.node-e{animation:reveal 9s ease-in-out 6s infinite}
@media(prefers-reduced-motion:reduce){.drift,.breathe,.moving,.node-a,.node-b,.node-c,.node-d,.node-e{animation:none}}
]]></style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1527"/><stop offset=".58" stop-color="#101c32"/><stop offset="1" stop-color="#08111e"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#70f2d5"/><stop offset="1" stop-color="#a2a5ff"/></linearGradient>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="21"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".3"/></filter></defs>
<rect width="1200" height="550" rx="28" fill="url(#bg)"/><rect width="1200" height="550" rx="28" fill="url(#grid)"/>
<text x="52" y="58" fill="#f0f7ff" font-size="27" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="750" >ONE APP. FOUR CONNECTED WORKSPACES.</text><text x="52" y="88" fill="#9aafc4" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Interface illustration based on project features; not a device screenshot.</text><g class="drift" style="animation-delay:0.3s"><rect x="52" y="125" width="270" height="362" rx="20" fill="#0d192b" stroke="#66e6d0" stroke-opacity=".19"/><rect x="65" y="140" width="244" height="41" rx="11" fill="#142337" stroke="#ffffff" stroke-opacity=".10"/><text x="77" y="167" fill="#66e6d0" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="750" >FILES</text><circle cx="291" cy="161" r="4" fill="#a3a2ff"/><text x="75" y="212" fill="#9aafc4" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >~/workspace/projects</text><rect x="67" y="228" width="238" height="45" rx="10" fill="#13263a" stroke="#66e6d0" stroke-opacity=".19"/><path d="M81 243 h10 l5 6 h13 v13 h-28 z" fill="none" stroke="#66e6d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="256" fill="#f0f7ff" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >src</text><rect x="67" y="281" width="238" height="45" rx="10" fill="#13263a" stroke="#ffffff" stroke-opacity=".045"/><path d="M81 296 h10 l5 6 h13 v13 h-28 z" fill="none" stroke="#a3a2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="309" fill="#f0f7ff" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >README.md</text><rect x="67" y="334" width="238" height="45" rx="10" fill="#13263a" stroke="#ffffff" stroke-opacity=".045"/><path d="M81 349 h10 l5 6 h13 v13 h-28 z" fill="none" stroke="#a3a2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="362" fill="#f0f7ff" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >build.gradle</text><rect x="67" y="387" width="238" height="45" rx="10" fill="#13263a" stroke="#ffffff" stroke-opacity=".045"/><path d="M81 402 h10 l5 6 h13 v13 h-28 z" fill="none" stroke="#a3a2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="415" fill="#f0f7ff" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >project.json</text><text x="74" y="472" fill="#66e6d0" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >4 items  |  filtered</text></g><g class="drift" style="animation-delay:1.8s"><rect x="350" y="125" width="270" height="362" rx="20" fill="#0d192b" stroke="#a3a2ff" stroke-opacity=".19"/><rect x="363" y="140" width="244" height="41" rx="11" fill="#142337" stroke="#ffffff" stroke-opacity=".10"/><text x="375" y="167" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="750" >EDITOR</text><circle cx="589" cy="161" r="4" fill="#a3a2ff"/><text x="373" y="208" fill="#66e6d0" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" >file_bridge.py</text><text x="373" y="240" fill="#667f96" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >01</text><text x="402" y="240" fill="#f0f7ff" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >def dispatch(cmd):</text><text x="373" y="280" fill="#667f96" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >02</text><text x="402" y="280" fill="#a3a2ff" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >    verify(cmd)</text><text x="373" y="320" fill="#667f96" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >03</text><text x="402" y="320" fill="#66e6d0" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >    result = run(cmd)</text><text x="373" y="360" fill="#667f96" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >04</text><text x="402" y="360" fill="#f0f7ff" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >    return result</text><text x="373" y="400" fill="#667f96" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >05</text><text x="402" y="400" fill="#f0f7ff" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" ></text><rect x="369" y="433" width="88" height="33" rx="10" fill="#165450" stroke="#ffffff" stroke-opacity=".10"/><text x="413" y="455" fill="#66e6d0" font-size="12" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle" >SAVE</text></g><g class="drift" style="animation-delay:3.2s"><rect x="648" y="125" width="270" height="362" rx="20" fill="#0d192b" stroke="#a3a2ff" stroke-opacity=".19"/><rect x="661" y="140" width="244" height="41" rx="11" fill="#142337" stroke="#ffffff" stroke-opacity=".10"/><text x="673" y="167" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="750" >TERMINAL</text><circle cx="887" cy="161" r="4" fill="#a3a2ff"/><text x="670" y="211" fill="#9aafc4" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >session: ~/workspace</text><text x="670" y="250" fill="#66e6d0" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >$ python3 main.py</text><text x="670" y="299" fill="#9aafc4" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >Starting bridge...</text><text x="670" y="348" fill="#f0f7ff" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >Files scanned: 128</text><text x="670" y="397" fill="#66e6d0" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="550" >Exit code: 0</text><circle cx="682" cy="450" r="5" fill="#66e6d0"/><text x="699" y="455" fill="#9aafc4" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Ready</text></g><g class="drift" style="animation-delay:4.6s"><rect x="920" y="125" width="270" height="362" rx="20" fill="#0d192b" stroke="#a3a2ff" stroke-opacity=".19"/><rect x="933" y="140" width="244" height="41" rx="11" fill="#142337" stroke="#ffffff" stroke-opacity=".10"/><text x="945" y="167" fill="#f0f7ff" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="750" >AI AGENT</text><circle cx="1159" cy="161" r="4" fill="#a3a2ff"/><text x="941" y="211" fill="#9aafc4" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Task: inspect project</text><rect x="936" y="231" width="237" height="61" rx="12" fill="#18293e" stroke="#ffffff" stroke-opacity=".10"/><text x="948" y="252" fill="#a3a2ff" font-size="12" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" >PLAN</text><text x="948" y="274" fill="#f0f7ff" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Read structure</text><rect x="936" y="304" width="237" height="61" rx="12" fill="#18293e" stroke="#ffffff" stroke-opacity=".10"/><text x="948" y="325" fill="#66e6d0" font-size="12" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" >TOOL</text><text x="948" y="347" fill="#f0f7ff" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >list_files</text><rect x="936" y="377" width="237" height="61" rx="12" fill="#18293e" stroke="#ffffff" stroke-opacity=".10"/><text x="948" y="398" fill="#a3a2ff" font-size="12" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" >REVIEW</text><text x="948" y="420" fill="#f0f7ff" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" >Allow changes</text><rect x="938" y="463" width="232" height="5" rx="3" fill="#66e6d0" stroke="#ffffff" stroke-opacity=".10"/></g><text x="600" y="528" fill="#9aafc4" font-size="12" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="650" text-anchor="middle" >VECTOR INTERFACE PREVIEW  /  NOT REAL APPLICATION SCREENSHOTS</text></svg>