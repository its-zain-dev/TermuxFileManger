name: Android Release Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pr:
    name: Validate Android Release sources (no Debug APK)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test bridge
        run: python3 -m unittest discover -s tests -v
      - name: Test, lint and assemble Release (validation only)
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

  release-build:
    name: Build and publish signed Android Release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Require permanent release signing
        shell: bash
        env:
          TFM_KEYSTORE_B64: ${{ secrets.TFM_RELEASE_KEYSTORE_BASE64 }}
          TFM_STORE_PASSWORD: ${{ secrets.TFM_RELEASE_STORE_PASSWORD }}
          TFM_KEY_ALIAS: ${{ secrets.TFM_RELEASE_KEY_ALIAS }}
          TFM_KEY_PASSWORD: ${{ secrets.TFM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$TFM_KEYSTORE_B64" || -z "$TFM_STORE_PASSWORD" || -z "$TFM_KEY_ALIAS" || -z "$TFM_KEY_PASSWORD" ]]; then
            echo '::error::Missing permanent signing secrets. Run python3 scripts/provision_signing.py in Termux before pushing.'
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/tfm-release-keystore.jks"
          printf '%s' "$TFM_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          export TFM_RELEASE_STORE_PASSWORD="$TFM_STORE_PASSWORD"
          keytool -list -keystore "$KEYSTORE_PATH" -storetype JKS \
            -storepass:env TFM_RELEASE_STORE_PASSWORD -alias "$TFM_KEY_ALIAS" > /dev/null
          echo "TFM_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo 'Permanent release signing identity verified.'

      - name: Test Termux file protocol
        run: python3 -m unittest discover -s tests -v

      - name: Test, lint and build Release
        env:
          TFM_RELEASE_STORE_PASSWORD: ${{ secrets.TFM_RELEASE_STORE_PASSWORD }}
          TFM_RELEASE_KEY_ALIAS: ${{ secrets.TFM_RELEASE_KEY_ALIAS }}
          TFM_RELEASE_KEY_PASSWORD: ${{ secrets.TFM_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: app/build/reports/

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare searchable release notes and checksums
        id: assets
        env:
          SIGNING_MODE: persistent
        run: |
          python3 scripts/ci_release.py \
            --signing-mode "$SIGNING_MODE" \
            --apk app/build/outputs/apk/release/app-release.apk \
            --out "$RUNNER_TEMP/tfm-release-assets" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --commit "$GITHUB_SHA"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.assets.outputs.version }}-build.${{ github.run_number }}
          name: ${{ steps.assets.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: ${{ steps.assets.outputs.notes }}
          files: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.checksum }}
